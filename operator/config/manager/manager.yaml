---
apiVersion: v1
kind: Namespace
metadata:
  name: litemlflow-system
  labels:
    app.kubernetes.io/name: litemlflow-operator
---
apiVersion: apps/v1
kind: Deployment
metadata:
  name: litemlflow-operator
  namespace: litemlflow-system
  labels:
    app.kubernetes.io/name: litemlflow-operator
    app.kubernetes.io/component: controller
spec:
  replicas: 1
  selector:
    matchLabels:
      app.kubernetes.io/name: litemlflow-operator
  template:
    metadata:
      labels:
        app.kubernetes.io/name: litemlflow-operator
    spec:
      serviceAccountName: litemlflow-operator
      terminationGracePeriodSeconds: 10
      securityContext:
        runAsNonRoot: true
      containers:
        - name: manager
          # Replace with your pushed image, e.g.:
          # ghcr.io/your-org/litemlflow-operator:v0.1.0
          image: litemlflow-operator:latest
          imagePullPolicy: IfNotPresent
          command:
            - /litemlflow-operator
          args:
            - --leader-elect=false
            - --metrics-bind-address=:8080
            - --health-probe-bind-address=:8081
          ports:
            - name: metrics
              containerPort: 8080
            - name: health
              containerPort: 8081
          securityContext:
            allowPrivilegeEscalation: false
            capabilities:
              drop: [ALL]
            readOnlyRootFilesystem: true
          livenessProbe:
            httpGet:
              path: /healthz
              port: 8081
            initialDelaySeconds: 15
            periodSeconds: 20
          readinessProbe:
            httpGet:
              path: /readyz
              port: 8081
            initialDelaySeconds: 5
            periodSeconds: 10
          resources:
            requests:
              cpu: 10m
              memory: 64Mi
            limits:
              cpu: 500m
              memory: 128Mi
