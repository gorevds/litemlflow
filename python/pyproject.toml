[build-system]
requires = ["hatchling>=1.18.0"]
build-backend = "hatchling.build"

[project]
name = "litemlflow"
version = "0.1.0"
description = "Python SDK for LiteMLflow — single-binary, MLflow-compatible experiment tracker."
readme = "README.md"
authors = [{ name = "LiteMLflow Authors" }]
license = "Apache-2.0"
requires-python = ">=3.9"
keywords = ["mlflow", "tracking", "ml", "llm", "experiment"]
classifiers = [
    "Development Status :: 3 - Alpha",
    "Intended Audience :: Developers",
    "Intended Audience :: Science/Research",
    "License :: OSI Approved :: Apache Software License",
    "Programming Language :: Python :: 3",
    "Programming Language :: Python :: 3.9",
    "Programming Language :: Python :: 3.10",
    "Programming Language :: Python :: 3.11",
    "Programming Language :: Python :: 3.12",
    "Topic :: Scientific/Engineering :: Artificial Intelligence",
]
dependencies = [
    "requests>=2.28",
]

[project.optional-dependencies]
dev = [
    "pytest>=7.0",
    "pytest-timeout>=2.1",
    "ruff>=0.5",
    "mypy>=1.8",
]
mlflow-compat = [
    "mlflow-skinny>=2.10",
]
langchain = [
    "langchain-core>=0.2",
]

[tool.hatch.build.targets.wheel]
packages = ["litemlflow"]

[tool.ruff]
line-length = 100
target-version = "py39"

[tool.ruff.lint]
select = ["E", "F", "I", "B", "UP", "N"]
ignore = ["E501"]

[tool.mypy]
python_version = "3.9"
strict = true
warn_return_any = true
warn_unused_ignores = true

[tool.pytest.ini_options]
testpaths = ["tests"]
filterwarnings = ["error"]
timeout = 30
