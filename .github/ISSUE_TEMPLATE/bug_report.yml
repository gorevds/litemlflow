name: Bug report
description: Something is broken or behaving unexpectedly.
labels: ["bug", "needs-triage"]
body:
  - type: markdown
    attributes:
      value: |
        Thanks for taking the time to file a bug report. Please fill in as much detail as possible.
        For security vulnerabilities, **do not open a public issue** — see [SECURITY.md](../SECURITY.md).

  - type: input
    id: version
    attributes:
      label: LiteMLflow version
      description: Output of `litemlflow version`
      placeholder: "v1.0.0 (go1.22.3, linux/amd64)"
    validations:
      required: true

  - type: dropdown
    id: os
    attributes:
      label: Operating system / arch
      options:
        - Linux amd64
        - Linux arm64
        - macOS amd64
        - macOS arm64 (Apple Silicon)
        - Docker (Linux)
        - Kubernetes / Helm
        - Other
    validations:
      required: true

  - type: dropdown
    id: install-method
    attributes:
      label: Install method
      options:
        - Homebrew
        - Docker
        - Helm
        - Debian package
        - RPM package
        - Snap
        - Built from source
        - Binary download
    validations:
      required: true

  - type: textarea
    id: description
    attributes:
      label: What happened?
      description: Clear description of the problem. Include any error messages verbatim.
    validations:
      required: true

  - type: textarea
    id: expected
    attributes:
      label: What did you expect to happen?
    validations:
      required: true

  - type: textarea
    id: reproducer
    attributes:
      label: Minimal reproduction
      description: |
        A `curl` command, a Python script, or a shell sequence that reproduces the issue.
        The shorter the better — remove anything not needed to trigger the bug.
      render: bash
    validations:
      required: true

  - type: textarea
    id: server-log
    attributes:
      label: Server log output
      description: Run `litemlflow up --data ./data` and paste the relevant log lines here.
      render: text

  - type: dropdown
    id: mlflow-client
    attributes:
      label: Are you using the MLflow Python client?
      options:
        - "Yes — version:"
        - "No — using LiteMLflow native SDK"
        - "No — using curl / HTTP directly"
        - "Not applicable"

  - type: textarea
    id: additional
    attributes:
      label: Additional context
      description: Config file, environment variables (redact secrets), Helm values, etc.
