name: CI

on:
  push:
    branches: [main, master]
  pull_request:
    branches: [main, master]

permissions:
  contents: read

jobs:
  go:
    name: Go (build + tests + race) — ${{ matrix.os }}
    runs-on: ${{ matrix.os }}
    strategy:
      matrix:
        os: [ubuntu-latest, macos-latest]
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-go@v5
        with:
          go-version: "1.26.4"
          cache: true
      - name: vet
        run: go vet ./...
      - name: test
        run: go test -race -coverprofile=coverage.txt -covermode=atomic ./...
      - name: build
        run: |
          mkdir -p bin
          go build -o bin/litemlflow ./cmd/litemlflow
      - uses: actions/upload-artifact@v4
        if: matrix.os == 'ubuntu-latest'
        with:
          name: litemlflow-${{ github.sha }}
          path: bin/litemlflow

  python:
    name: Python SDK + MLflow compat
    needs: go
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
      - uses: actions/download-artifact@v4
        with:
          name: litemlflow-${{ github.sha }}
          path: bin
      - run: chmod +x bin/litemlflow
      - name: install python deps
        run: |
          python -m pip install --upgrade pip
          python -m pip install -e python/[dev] mlflow-skinny
      - name: SDK tests
        run: pytest python/tests -v
      - name: MLflow compat suite
        run: python tests/integration/mlflow_compat.py

  lint:
    name: Lint
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-go@v5
        with:
          go-version: "1.26.4"
          cache: true
      - name: gofmt diff
        run: |
          fmt_out=$(gofmt -l .)
          if [ -n "$fmt_out" ]; then
            echo "::error::Some files need gofmt:"
            echo "$fmt_out"
            exit 1
          fi
      - name: install staticcheck
        run: go install honnef.co/go/tools/cmd/staticcheck@latest
      - run: staticcheck ./...

  docker:
    name: Docker build
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - name: build image
        run: docker build --build-arg VERSION=ci-${{ github.sha }} -t litemlflow:ci .
      - name: smoke test image
        run: |
          docker run --rm -d --name lmf -p 5050:5000 -v $(pwd)/data:/data litemlflow:ci
          for _ in $(seq 1 20); do
            if curl -fsS http://127.0.0.1:5050/healthz; then break; fi
            sleep 0.5
          done
          curl -fsS http://127.0.0.1:5050/healthz | grep -q '"ok":true'
          docker logs lmf | tail -20
          docker stop lmf
