name: CI

on:
  push:
    branches: [main, master]
  pull_request:
    branches: [main, master]

permissions:
  contents: read

jobs:
  go:
    name: Go (build + tests + race) — ${{ matrix.os }}
    runs-on: ${{ matrix.os }}
    strategy:
      matrix:
        os: [ubuntu-latest, macos-latest]
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4.4.0
      - uses: actions/setup-go@40f1582b2485089dde7abd97c1529aa768e1baff # v5.6.0
        with:
          go-version: "1.26.6"
          cache: true
      - name: vet
        run: go vet ./...
      - name: test
        run: go test -race -coverprofile=coverage.txt -covermode=atomic ./...
      - name: build
        run: |
          mkdir -p bin
          go build -o bin/litemlflow ./cmd/litemlflow
      # operator/ is a separate Go module, so the root `./...` above skips it.
      - name: operator vet + test
        if: matrix.os == 'ubuntu-latest'
        working-directory: operator
        run: |
          go vet ./...
          go test ./...
      - uses: actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02 # v4.6.2
        if: matrix.os == 'ubuntu-latest'
        with:
          name: litemlflow-${{ github.sha }}
          path: bin/litemlflow

  python:
    name: Python SDK + MLflow compat
    needs: go
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4.4.0
      - uses: actions/setup-python@a26af69be951a213d495a4c3e4e4022e16d87065 # v5.6.0
        with:
          python-version: "3.12"
      - uses: actions/download-artifact@d3f86a106a0bac45b974a628896c90dbdf5c8093 # v4.3.0
        with:
          name: litemlflow-${{ github.sha }}
          path: bin
      - run: chmod +x bin/litemlflow
      - name: install python deps
        run: |
          python -m pip install --upgrade pip
          python -m pip install -e python/[dev] mlflow-skinny
      - name: SDK tests
        run: pytest python/tests -v
      - name: MLflow compat suite
        run: python tests/integration/mlflow_compat.py

  lint:
    name: Lint
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4.4.0
      - uses: actions/setup-go@40f1582b2485089dde7abd97c1529aa768e1baff # v5.6.0
        with:
          go-version: "1.26.6"
          cache: true
      - name: gofmt diff
        run: |
          fmt_out=$(gofmt -l .)
          if [ -n "$fmt_out" ]; then
            echo "::error::Some files need gofmt:"
            echo "$fmt_out"
            exit 1
          fi
      - name: install staticcheck
        run: go install honnef.co/go/tools/cmd/staticcheck@latest
      - run: staticcheck ./...

  docker:
    name: Docker build
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4.4.0
      - name: build image
        run: docker build --build-arg VERSION=ci-${{ github.sha }} -t litemlflow:ci .
      - name: smoke test image
        run: |
          # The image runs as distroless nonroot (UID 65532); make the
          # bind-mounted data dir writable by it so the SQLite store can be
          # created (otherwise the server crashes on startup).
          mkdir -p data && chmod 0777 data
          docker run --rm -d --name lmf -p 5050:5000 -v "$(pwd)/data:/data" litemlflow:ci
          ok=
          for _ in $(seq 1 20); do
            if curl -fsS http://127.0.0.1:5050/healthz | grep -q '"ok":true'; then ok=1; break; fi
            sleep 0.5
          done
          docker logs lmf | tail -20   # always surface startup logs for debugging
          docker stop lmf
          test -n "$ok"
