name: Security

on:
  push:
    branches: [main, master]
  pull_request:
    branches: [main, master]
  schedule:
    # Re-run every Monday so newly disclosed CVEs in pinned deps are caught.
    - cron: "0 8 * * 1"

permissions:
  contents: read
  security-events: write

jobs:
  govulncheck:
    name: govulncheck (stdlib + deps)
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-go@v5
        with:
          go-version: "1.26.4"
          cache: true
      - name: govulncheck (root module)
        run: |
          go install golang.org/x/vuln/cmd/govulncheck@latest
          govulncheck ./...
      - name: govulncheck (operator module)
        run: |
          cd operator
          govulncheck ./...

  gosec:
    name: gosec
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-go@v5
        with:
          go-version: "1.26.4"
          cache: true
      # We track which findings are accepted in docs/security-audit.md and
      # gate the build on no new HIGH-severity findings outside the
      # documented accept-list. The accept-list is enforced by exact
      # rule-id+file:line match — a new HIGH on a different line will fail.
      - name: install gosec
        run: go install github.com/securego/gosec/v2/cmd/gosec@latest
      - name: gosec scan
        run: |
          gosec -fmt json -quiet ./... > /tmp/gosec.json || true
          python3 .github/scripts/check_gosec.py /tmp/gosec.json docs/security-audit.md

  semgrep:
    name: semgrep (security-audit + golang)
    runs-on: ubuntu-latest
    container:
      image: returntocorp/semgrep:latest
    steps:
      - uses: actions/checkout@v4
      - run: semgrep --config p/security-audit --config p/golang --error --severity ERROR --severity WARNING --metrics off
        # WARNING-level findings trigger the build today; tighten to ERROR-only later.
        continue-on-error: true
