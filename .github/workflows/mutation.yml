name: Mutation testing

# Mutation testing is slow (1–2 min for store, ~15 s for auth). Run on a
# nightly cron and on demand, not every PR. Baselines are documented in
# docs/security-audit.md and enforced via --threshold-efficacy below;
# regressions fail the build.

on:
  workflow_dispatch:
  schedule:
    - cron: "0 4 * * *"

permissions:
  contents: read

jobs:
  mutation:
    name: gremlins (auth + store)
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-go@v5
        with:
          go-version: "1.26.3"
          cache: true
      - name: install gremlins
        run: go install github.com/go-gremlins/gremlins/cmd/gremlins@latest
      # Thresholds match the v1.0 baseline (auth=89%, store=74%, webhooks=53%).
      # Slightly under to absorb test-flake; tighten as we add tests.
      - name: mutation — auth
        run: gremlins unleash --threshold-efficacy 80 ./internal/auth/
      - name: mutation — store
        run: gremlins unleash --threshold-efficacy 70 ./internal/store/
      - name: mutation — webhooks
        run: gremlins unleash --threshold-efficacy 50 ./internal/webhooks/
