{{- if eq .Values.config.authMode "basic" -}}
apiVersion: v1
kind: Secret
metadata:
  name: {{ include "litemlflow.fullname" . }}-auth
  namespace: {{ .Release.Namespace }}
  labels:
    {{- include "litemlflow.labels" . | nindent 4 }}
  annotations:
    # This secret is rendered from values. For production, use an external
    # secret manager (e.g. External Secrets Operator) and set
    # config.authMode=basic while supplying a pre-created Secret.
    helm.sh/resource-policy: keep
type: Opaque
stringData:
  basic-user: {{ .Values.auth.user | quote }}
  basic-pass-hash: {{ .Values.auth.passHash | quote }}
{{- end }}
