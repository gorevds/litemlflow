apiVersion: apps/v1
kind: StatefulSet
metadata:
  name: {{ include "litemlflow.fullname" . }}
  namespace: {{ .Release.Namespace }}
  labels:
    {{- include "litemlflow.labels" . | nindent 4 }}
spec:
  replicas: {{ .Values.replicaCount }}
  selector:
    matchLabels:
      {{- include "litemlflow.selectorLabels" . | nindent 6 }}
  serviceName: {{ include "litemlflow.fullname" . }}-headless
  template:
    metadata:
      annotations:
        # Restart pods when the Secret changes (auth credentials rotation).
        checksum/secret: {{ include (print $.Template.BasePath "/secret.yaml") . | sha256sum }}
        {{- with .Values.podAnnotations }}
        {{- toYaml . | nindent 8 }}
        {{- end }}
      labels:
        {{- include "litemlflow.selectorLabels" . | nindent 8 }}
    spec:
      {{- with .Values.imagePullSecrets }}
      imagePullSecrets:
        {{- toYaml . | nindent 8 }}
      {{- end }}
      serviceAccountName: {{ include "litemlflow.serviceAccountName" . }}
      securityContext:
        {{- toYaml .Values.podSecurityContext | nindent 8 }}
      containers:
        - name: litemlflow
          securityContext:
            {{- toYaml .Values.securityContext | nindent 12 }}
          image: "{{ .Values.image.repository }}:{{ .Values.image.tag | default .Chart.AppVersion }}"
          imagePullPolicy: {{ .Values.image.pullPolicy }}
          ports:
            - name: http
              containerPort: 5000
              protocol: TCP
          env:
            - name: LITEMLFLOW_ADDR
              value: {{ .Values.config.addr | quote }}
            - name: LITEMLFLOW_DATA
              value: /data
            - name: LITEMLFLOW_AUTH
              value: {{ .Values.config.authMode | quote }}
            {{- if eq .Values.config.authMode "basic" }}
            - name: LITEMLFLOW_BASIC_USER
              valueFrom:
                secretKeyRef:
                  name: {{ include "litemlflow.fullname" . }}-auth
                  key: basic-user
            - name: LITEMLFLOW_BASIC_PASS_HASH
              valueFrom:
                secretKeyRef:
                  name: {{ include "litemlflow.fullname" . }}-auth
                  key: basic-pass-hash
            {{- end }}
            {{- with .Values.extraEnv }}
            {{- toYaml . | nindent 12 }}
            {{- end }}
          livenessProbe:
            {{- toYaml .Values.livenessProbe | nindent 12 }}
          readinessProbe:
            {{- toYaml .Values.readinessProbe | nindent 12 }}
          resources:
            {{- toYaml .Values.resources | nindent 12 }}
          volumeMounts:
            - name: data
              mountPath: /data
            - name: tmp
              mountPath: /tmp
      volumes:
        # /tmp must be writable even with readOnlyRootFilesystem=true.
        - name: tmp
          emptyDir: {}
      {{- if not .Values.persistence.enabled }}
        - name: data
          emptyDir: {}
      {{- end }}
      {{- with .Values.nodeSelector }}
      nodeSelector:
        {{- toYaml . | nindent 8 }}
      {{- end }}
      {{- with .Values.affinity }}
      affinity:
        {{- toYaml . | nindent 8 }}
      {{- end }}
      {{- with .Values.tolerations }}
      tolerations:
        {{- toYaml . | nindent 8 }}
      {{- end }}
  {{- if .Values.persistence.enabled }}
  volumeClaimTemplates:
    - metadata:
        name: data
        {{- with .Values.persistence.annotations }}
        annotations:
          {{- toYaml . | nindent 10 }}
        {{- end }}
      spec:
        accessModes:
          - {{ .Values.persistence.accessMode }}
        {{- if .Values.persistence.storageClass }}
        storageClassName: {{ .Values.persistence.storageClass | quote }}
        {{- end }}
        resources:
          requests:
            storage: {{ .Values.persistence.size }}
  {{- end }}
