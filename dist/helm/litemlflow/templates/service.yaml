apiVersion: v1
kind: Service
metadata:
  name: {{ include "litemlflow.fullname" . }}
  namespace: {{ .Release.Namespace }}
  labels:
    {{- include "litemlflow.labels" . | nindent 4 }}
  {{- with .Values.service.annotations }}
  annotations:
    {{- toYaml . | nindent 4 }}
  {{- end }}
spec:
  type: {{ .Values.service.type }}
  ports:
    - port: {{ .Values.service.port }}
      targetPort: http
      protocol: TCP
      name: http
  selector:
    {{- include "litemlflow.selectorLabels" . | nindent 4 }}
---
# Headless service required by the StatefulSet for stable pod DNS names.
apiVersion: v1
kind: Service
metadata:
  name: {{ include "litemlflow.fullname" . }}-headless
  namespace: {{ .Release.Namespace }}
  labels:
    {{- include "litemlflow.labels" . | nindent 4 }}
spec:
  type: ClusterIP
  clusterIP: None
  ports:
    - port: {{ .Values.service.port }}
      targetPort: http
      protocol: TCP
      name: http
  selector:
    {{- include "litemlflow.selectorLabels" . | nindent 4 }}
